name: Sync Code to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 secrets.GITEE_TOKEN，无法同步代码到 Gitee"
            exit 1
          fi
          git config user.name "SystemTemp"
          git config user.email "systemtemp@users.noreply.github.com"
          # Gitee 镜像：HTTPS push 的凭证格式是「Gitee登录名:私人令牌」。
          # 仓库归属 TDSI，API token 不一定对应用户名 SystemTemp，
          # 先用 API 查出 token 所属登录名再拼 URL，避免 403。
          LOGIN=$(curl -s "https://gitee.com/api/v5/user?access_token=${GITEE_TOKEN}" | sed -n 's/.*"login":"\([^"]*\)".*/\1/p')
          if [ -z "$LOGIN" ]; then
            echo "::error::GITEE_TOKEN 无效（无法查询到登录名）"
            exit 1
          fi
          echo "Gitee 登录名: $LOGIN"
          git remote add gitee "https://${LOGIN}:${GITEE_TOKEN}@gitee.com/TDSI/fanhua-camera.git"
          git push gitee --force --tags "HEAD:main"
          echo "代码已同步到 Gitee main 与全部 tags"
