name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release tag（例如 v0.1.12-beta）"
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout helper scripts
        uses: actions/checkout@v4

      - name: Download release assets
        run: |
          mkdir -p release-tmp
          # 只下载 APK：GitHub 自动生成的源码 zip（Source code）不需要传到 Gitee，
          # 传了既浪费带宽又让 Gitee 上出现一堆无用的 .zip 附件。
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir release-tmp
          ls -la release-tmp
          if ! ls release-tmp/*.apk >/dev/null 2>&1; then
            echo "::error::没有下载到任何 APK"
            exit 1
          fi

      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 不用 set -e：管道里辅助命令的非零退出不该中断脚本，
          # Gitee 附件列表在上传后短时间内可能返回异常，那只是「暂时查不到」。
          # 关键失败点用显式 exit 1 判定。
          set -uo pipefail
          # 令牌缺失时必须明确失败：否则后续步骤会静默跳过，
          # 表现为「Release 建好了但版本通道没更新」，应用内检查更新永远看不到新版本。
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 secrets.GITEE_TOKEN，无法同步到 Gitee"
            exit 1
          fi

          API="https://gitee.com/api/v5/repos/TDSI/fanhua-camera"
          HELPER="python3 .github/scripts/gitee_sync_helper.py"
          CURL="curl -s --retry 3 --retry-delay 5 --connect-timeout 20"

          # ── 1. 找到或创建 Gitee Release ──
          EXISTS=$($CURL "$API/releases/tags/$TAG_NAME?access_token=$GITEE_TOKEN")
          RID=$(printf '%s' "$EXISTS" | $HELPER release-id)

          if [ -z "$RID" ]; then
            BODY=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            PAYLOAD=$(BODY="$BODY" GITEE_TOKEN="$GITEE_TOKEN" TAG_NAME="$TAG_NAME" $HELPER create-payload)
            RID=$($CURL -X POST "$API/releases" \
              -H "Content-Type: application/json;charset=UTF-8" -d "$PAYLOAD" | $HELPER release-id)
          fi

          echo "Gitee release id: $RID"
          if [ -z "$RID" ]; then
            echo "::error::无法创建 Gitee Release"
            exit 1
          fi

          # ── 2. 查已存在附件，避免重复上传（Gitee 对 20MB+ 附件很慢） ──
          EXISTING=$($CURL "$API/releases/$RID/attach_files?access_token=$GITEE_TOKEN" | $HELPER attach-names)
          echo "已存在附件:"
          printf '%s\n' "$EXISTING"

          # ── 3. 上传 APK ──
          # GitHub 的美国 runner 传 30MB 到 Gitee 经常要 20~40 分钟，这是实测结果
          # （v0.1.33 那次跑了 36 分钟，APK 最终是传成功的）。
          # 所以这里给足时间，只在连接真正「不动」时才断开重试：
          #   --speed-limit 8192 --speed-time 120  → 连续 120s 低于 8KB/s 才判定卡死
          #   --max-time 2700                      → 单次最多 45 分钟
          for f in release-tmp/*.apk; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if printf '%s\n' "$EXISTING" | grep -qxF "$name"; then
              echo "$name 已存在，跳过上传"
              continue
            fi
            size=$(du -h "$f" | cut -f1)
            echo "uploading $name ($size)"
            ok=0
            code=000
            for attempt in 1 2 3 4; do
              code=$(curl -s -o /tmp/attach_resp.txt -w "%{http_code}" \
                --speed-limit 8192 --speed-time 120 \
                --connect-timeout 30 --max-time 2700 \
                -X POST "$API/releases/$RID/attach_files" \
                -F "access_token=$GITEE_TOKEN" -F "file=@$f" || echo "000")
              echo "attempt $attempt -> HTTP $code"
              head -c 300 /tmp/attach_resp.txt || true
              echo
              if [ "$code" = "200" ] || [ "$code" = "201" ]; then
                ok=1
                break
              fi
              if [ "$code" = "409" ] || [ "$code" = "422" ]; then
                echo "附件已存在，视为成功"
                ok=1
                break
              fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::上传 $name 到 Gitee 失败（最后 HTTP $code）"
              exit 1
            fi
          done

          # ── 4. 附件列表回读（仅作提示，不作为失败依据） ──
          # Gitee 的 attach_files 列表在附件刚上传后索引延迟很久，经常查不到；
          # 真正的判据是下一步对「APK 直链」的 Range GET 校验，
          # 所以这里查不到只 warn，不 exit——否则又会出现「传成功了却报失败」。
          FINAL=0
          for probe in 1 2 3; do
            sleep 10
            FINAL=$($CURL "$API/releases/$RID/attach_files?access_token=$GITEE_TOKEN" 2>/dev/null | $HELPER attach-count 2>/dev/null || echo 0)
            echo "附件数探测 #$probe: $FINAL"
            if [ "$FINAL" != "0" ] && [ -n "$FINAL" ]; then
              break
            fi
          done
          if [ "$FINAL" = "0" ] || [ -z "$FINAL" ]; then
            echo "::warning::附件列表暂时查不到（索引延迟），以 APK 直链校验为准"
          else
            echo "附件数: $FINAL"
          fi

      - name: Update Gitee version.json
        # always()：即使上传步骤的校验报错也要尝试更新版本通道（附件往往其实已传成功）。
        # 但绝不能盲目写：下面会先确认 APK 直链真的可下载，否则版本通道会把用户
        # 指向一个 404 的文件——那比不更新更糟。
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -uo pipefail
          HELPER="python3 .github/scripts/gitee_sync_helper.py"
          CURL="curl -s --retry 3 --retry-delay 5 --connect-timeout 20"

          APK_NAME=$(basename "$(ls release-tmp/*.apk 2>/dev/null | head -1)")
          if [ -z "$APK_NAME" ]; then
            echo "::error::找不到 APK 附件，跳过版本通道更新"
            exit 1
          fi
          NOTES=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          echo "apk: $APK_NAME"

          # 前置硬校验：APK 必须真的能从 Gitee 下载到，才允许更新版本通道。
          # 注意：Gitee 对 Release 附件会拒绝 HEAD 请求（-I 直接返回错误），
          # 所以这里必须用 Range GET（只取前 1KB）来判断，接受 200/206。
          # 之前用 curl -I 导致「APK 明明传成功却报失败」。
          APK_URL="https://gitee.com/TDSI/fanhua-camera/releases/download/$TAG_NAME/$APK_NAME"
          echo "verify: $APK_URL"
          ok=0
          http=000
          for probe in 1 2 3 4 5 6 7 8; do
            http=$(curl -s -o /dev/null -L -w "%{http_code}" --max-time 90 \
              -r 0-1023 "$APK_URL" || echo "000")
            echo "probe #$probe -> $http"
            case "$http" in
              200|206) ok=1; break ;;
            esac
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::error::APK 尚不可下载（最后 $http），拒绝把版本通道指向 404 文件"
            exit 1
          fi
          echo "APK 直链可下载，继续更新版本通道"

          SHA=$($CURL "https://gitee.com/api/v5/repos/TDSI/file/contents/fanhua/version.json?access_token=$GITEE_TOKEN" 2>/dev/null | $HELPER content-sha 2>/dev/null || echo "")

          # 防止降级：手工补传旧版本（如 v0.1.24）时，绝不能把版本通道写回旧版，
          # 否则所有用户会被提示「更新」到一个更老的包。
          CURRENT=$($CURL "https://gitee.com/TDSI/file/raw/master/fanhua/version.json" 2>/dev/null | $HELPER version 2>/dev/null || echo "")
          echo "当前通道版本: '$CURRENT'  本次: '${TAG_NAME#v}'"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "${TAG_NAME#v}" ]; then
            NEWEST=$(printf '%s\n%s\n' "$CURRENT" "${TAG_NAME#v}" | sort -V | tail -1)
            if [ "$NEWEST" != "${TAG_NAME#v}" ]; then
              echo "本次版本 ${TAG_NAME#v} 不高于当前通道 $CURRENT，跳过版本通道更新（仅补传附件）"
              exit 0
            fi
          fi

          PAYLOAD=$(APK_NAME="$APK_NAME" NOTES="$NOTES" TAG_NAME="$TAG_NAME" SHA="$SHA" \
            GITEE_TOKEN="$GITEE_TOKEN" $HELPER version-payload)

          RESULT=$($CURL -X PUT "https://gitee.com/api/v5/repos/TDSI/file/contents/fanhua/version.json" \
            -H "Content-Type: application/json;charset=UTF-8" -d "$PAYLOAD")
          echo "$RESULT" | head -c 400
          echo

          # 回读校验：Gitee 文件写入有传播延迟，重试几次再判定
          ACTUAL=""
          for probe in 1 2 3 4 5 6; do
            sleep 5
            ACTUAL=$($CURL "https://gitee.com/TDSI/file/raw/master/fanhua/version.json" 2>/dev/null | $HELPER version 2>/dev/null || echo "")
            echo "version.json 回读 #$probe: '$ACTUAL'"
            if [ "$ACTUAL" = "${TAG_NAME#v}" ]; then
              break
            fi
          done
          if [ "$ACTUAL" != "${TAG_NAME#v}" ]; then
            echo "::error::版本通道更新失败，期望 ${TAG_NAME#v}，实际 '$ACTUAL'"
            exit 1
          fi
          echo "version.json 已更新到 $ACTUAL"
