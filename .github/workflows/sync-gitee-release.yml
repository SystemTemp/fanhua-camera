name: Sync Release to Gitee

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 Release tag（例如 v0.1.12-beta）"
        required: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download release assets
        run: |
          mkdir -p release-tmp
          gh release download "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --dir release-tmp
          ls -la release-tmp

      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          EXISTS=$(curl -s "https://gitee.com/api/v5/repos/TDSI/fanhua-camera/releases/tags/$TAG_NAME?access_token=$GITEE_TOKEN")
          RID=$(echo "$EXISTS" | python3 -c "
          import json,sys
          try:
              print(json.load(sys.stdin)['id'])
          except Exception:
              print('')
          ")
          if [ -z "$RID" ]; then
            BODY=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            PAYLOAD=$(BODY="$BODY" GITEE_TOKEN="$GITEE_TOKEN" TAG_NAME="$TAG_NAME" python3 -c "import json,os;print(json.dumps({'access_token':os.environ['GITEE_TOKEN'],'tag_name':os.environ['TAG_NAME'],'target_commitish':'main','name':os.environ['TAG_NAME'],'body':os.environ.get('BODY',''),'prerelease':False}))")
            RID=$(curl -s -X POST "https://gitee.com/api/v5/repos/TDSI/fanhua-camera/releases" -H "Content-Type: application/json;charset=UTF-8" -d "$PAYLOAD" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')")
          fi
          echo "Gitee release id: $RID"
          for f in release-tmp/*.apk; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            curl -s -X POST "https://gitee.com/api/v5/repos/TDSI/fanhua-camera/releases/$RID/attach_files" -F "access_token=$GITEE_TOKEN" -F "file=@$f"
            echo
          done

      - name: Update Gitee version.json
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          APK_NAME=$(basename "$(ls release-tmp/*.apk | head -1)")
          echo "apk file: $APK_NAME"
          NOTES=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          git clone --depth 1 "https://TDSI:$GITEE_TOKEN@gitee.com/TDSI/file.git" version-repo
          APK_NAME="$APK_NAME" NOTES="$NOTES" TAG_NAME="$TAG_NAME" python3 -c "
          import json, os
          ref = os.environ['TAG_NAME']
          notes = os.environ['NOTES']
          apk = os.environ['APK_NAME']
          v = {'version': ref.lstrip('v'), 'notes': notes, 'apk': f'https://gitee.com/TDSI/fanhua-camera/releases/download/{ref}/{apk}'}
          json.dump(v, open('version-repo/fanhua/version.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          "
          cd version-repo
          git config user.name "TDSI"
          git config user.email "TDSI@gitee.local"
          git add fanhua/version.json
          git commit -m "update version channel to $TAG_NAME" || true
          git push origin master
