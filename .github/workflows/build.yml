name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore signing key (本机固定签名优先)
        # 优先用本机签名文件（secret SIGNING_P12 为本机 fanhua-release.p12 的 base64），
        # 未设置时回退到自动生成的临时 debug 密钥（仅用于 CI 验证，不建议作为正式发布签名）。
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
        run: |
          mkdir -p signing
          if [ -n "$SIGNING_P12" ]; then
            echo "$SIGNING_P12" | base64 -d > signing/fanhua-release.p12
            echo "已还原本机固定签名 fanhua-release.p12"
          else
            echo "未提供 SIGNING_P12，生成临时 debug 签名（非正式发布签名）"
            keytool -genkeypair -v -keystore signing/fanhua-release.p12 -storetype PKCS12 \
              -alias fanhua -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fanhua2026 -keypass fanhua2026 \
              -dname "CN=fanhua, OU=CI, O=CI, L=CI, S=CI, C=CN"
          fi

      - name: Build debug & release APK
        # CI runner 自带 JDK 17 与 Android SDK，不需要 build.sh --setup 去自举
        # （那个分支会从镜像站下载 JDK，在 Actions 上既慢又容易失败）。
        # 直接用 gradlew，签名文件由上一步还原；SDK 路径由 runner 自带的环境变量提供。
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fanhua-camera-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            ## 繁花如梦相机 ${{ github.ref_name }}

            ### 本次更新
            - 滤镜色卡改用相机整合中徕卡一瞬包的真实 LUT 预览图，色卡与实际出片观感一致。
            - 徕卡水印支持三态可切换：关闭 / 白边画框（徕卡 92 号）/ 照片内叠加（标准 7 号）。
            - 设置页水印项改为三态选择，覆盖简/繁/英/日/韩/西/法/德/俄 9 语种。
        run: |
          cp app/build/outputs/apk/release/app-release.apk "fanhua-camera-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "fanhua-camera-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --notes "$RELEASE_NOTES" \
            || gh release upload "$GITHUB_REF_NAME" "fanhua-camera-${GITHUB_REF_NAME}.apk" --clobber
