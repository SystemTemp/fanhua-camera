name: Gen Keystore

on:
  push:
    paths:
      - ".gen-keystore-trigger"
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate fixed signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore fanhua-release.p12 \
            -storetype PKCS12 \
            -alias fanhua \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass fanhua2026 -keypass fanhua2026 \
            -dname "CN=Fanhua Camera, OU=Fanhua, O=Fanhua, L=Beijing, ST=Beijing, C=CN"
          echo "=== KEYSTORE_BASE64_START ==="
          base64 -w 0 fanhua-release.p12
          echo ""
          echo "=== KEYSTORE_BASE64_END ==="

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanhua-keystore
          path: fanhua-release.p12
